<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>裴玮课题组 · 团簇物理与计算材料 | 扬州大学</title>
<meta name="description" content="扬州大学裴玮课题组，聚焦团簇物理与计算材料学：配体团簇激发态动力学、量子点发光微观机理、功能团簇逆向设计、单团簇器件理论设计。">
<meta name="theme-color" content="#faf9f6">
<meta property="og:title" content="裴玮课题组 · 团簇物理与计算材料">
<meta property="og:description" content="扬州大学物理科学与技术学院 · 团簇物理与计算材料学研究组">
<meta property="og:type" content="website">
<style>
/* ==========================================================================
   裴玮课题组 · 站点样式
   设计取向：学术、克制、留白；深墨蓝 + 金铜色；细线分隔而非阴影
   ========================================================================== */

/* ---------- 1. Tokens ---------- */
:root {
  --paper: #faf9f6;
  --paper-2: #f4f1ea;
  --surface: #ffffff;
  --ink: #14181d;
  --ink-2: #414b57;
  --ink-3: #6a7480;
  --ink-4: #8a939c;
  --line: #e4e0d7;
  --line-2: #d2ccbe;
  --navy: #17334f;
  --navy-2: #0e2338;
  --navy-soft: #eaeff4;
  --gold: #8f6330;
  --gold-2: #c8a16a;
  --gold-soft: #f5eee1;
  --max: 1220px;
  --gutter: 48px;
  --r: 3px;
  --sans: "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans SC", system-ui, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia,
    "Songti SC", "Source Han Serif SC", serif;
  --mono: "SFMono-Regular", "JetBrains Mono", "Cascadia Mono", Consolas, "Liberation Mono", monospace;
  --ease: cubic-bezier(.22, .61, .36, 1);
}

/* ---------- 2. Reset & base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-feature-settings: "kern" 1, "liga" 1;
}
h1, h2, h3, h4 { margin: 0; font-weight: 600; line-height: 1.22; letter-spacing: -0.012em; }
p { margin: 0; }
a { color: inherit; text-decoration: none; }
img, svg { display: block; max-width: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
ul, ol { margin: 0; padding: 0; list-style: none; }
::selection { background: #d8e2ec; color: var(--navy-2); }
:focus-visible { outline: 2px solid var(--navy); outline-offset: 3px; border-radius: 2px; }

.skip {
  position: fixed; top: 8px; left: 8px; z-index: 999;
  padding: 8px 14px; background: var(--navy); color: #fff;
  font-size: 13px; transform: translateY(-160%); transition: transform .2s;
}
.skip:focus { transform: none; }

/* ---------- 3. Layout ---------- */
.wrap { width: 100%; max-width: var(--max); margin-inline: auto; padding-inline: var(--gutter); }
main { min-height: 60vh; }

.view { display: none; }
.view.is-active { display: block; animation: viewIn .5s var(--ease) both; }
@keyframes viewIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}

/* ---------- 4. Topbar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 60;
  background: rgba(250, 249, 246, .97);
  border-bottom: 1px solid var(--line);
}
@supports (backdrop-filter: blur(1px)) {
  .topbar { background: rgba(250, 249, 246, .86); backdrop-filter: saturate(160%) blur(14px); }
}
.topbar__inner {
  display: flex; align-items: center; gap: 32px;
  height: 68px;
}
.brand { display: flex; align-items: center; gap: 11px; flex: none; }
.brand__mark { width: 34px; height: 34px; color: var(--navy); flex: none; }
.brand__mark svg { width: 100%; height: 100%; }
.brand__text { display: flex; flex-direction: column; line-height: 1.25; }
.brand__text strong { font-size: 15px; font-weight: 600; letter-spacing: .02em; }
.brand__text small {
  font-size: 10.5px; color: var(--ink-3); letter-spacing: .06em;
  text-transform: uppercase; margin-top: 2px;
}

.nav { display: flex; align-items: center; gap: 4px; margin-inline: auto; }
.nav a {
  position: relative; padding: 8px 12px; font-size: 13.5px; color: var(--ink-2);
  letter-spacing: .01em; white-space: nowrap; transition: color .2s;
}
.nav a::after {
  content: ""; position: absolute; left: 12px; right: 12px; bottom: 2px; height: 1.5px;
  background: var(--navy); transform: scaleX(0); transform-origin: left;
  transition: transform .3s var(--ease);
}
.nav a:hover { color: var(--ink); }
.nav a.is-on { color: var(--navy); font-weight: 600; }
.nav a.is-on::after { transform: none; }

.topbar__tools { display: flex; align-items: center; gap: 14px; flex: none; }
.lang {
  display: flex; align-items: center; border: 1px solid var(--line-2);
  border-radius: 2px; overflow: hidden;
}
.lang button {
  padding: 4px 9px; font-size: 11.5px; letter-spacing: .06em; color: var(--ink-3);
  font-weight: 500; transition: background .2s, color .2s;
}
.lang button + button { border-left: 1px solid var(--line-2); }
.lang button.is-on { background: var(--navy); color: #fff; }

.burger { display: none; width: 38px; height: 38px; align-items: center; justify-content: center; flex-direction: column; gap: 5px; }
.burger span { display: block; width: 19px; height: 1.5px; background: var(--ink); transition: transform .3s var(--ease), opacity .2s; }
.burger[aria-expanded="true"] span:first-child { transform: translateY(3.2px) rotate(45deg); }
.burger[aria-expanded="true"] span:last-child { transform: translateY(-3.2px) rotate(-45deg); }

/* ---------- 5. Shared type ---------- */
.kicker {
  display: inline-flex; align-items: center; gap: 10px;
  font-size: 11px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase;
  color: var(--gold); font-family: var(--mono);
}
.kicker::after { content: ""; width: 26px; height: 1px; background: var(--line-2); }

.sec { padding-block: 88px; }
.sec--tight { padding-block: 64px; }
.sec + .sec { border-top: 1px solid var(--line); }

.sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; margin-bottom: 44px; }
.sec-head__main { max-width: 640px; }
.sec-head h2 { font-size: clamp(24px, 2.6vw, 33px); margin-top: 14px; }
.sec-head .lead { margin-top: 14px; color: var(--ink-2); font-size: 15px; line-height: 1.8; max-width: 58ch; }
.sec-num {
  font-family: var(--mono); font-size: 11px; color: var(--ink-4); letter-spacing: .1em;
  padding-bottom: 6px; flex: none;
}

.lead-lg { font-size: 17px; line-height: 1.85; color: var(--ink-2); }
.muted { color: var(--ink-3); }
.small { font-size: 13px; line-height: 1.7; }
.mono { font-family: var(--mono); }

/* ---------- 6. Buttons & links ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 9px;
  padding: 11px 22px; font-size: 13.5px; font-weight: 500; letter-spacing: .02em;
  border: 1px solid var(--navy); background: var(--navy); color: #fff;
  border-radius: var(--r); transition: background .22s, color .22s, border-color .22s, transform .22s;
}
.btn:hover { background: var(--navy-2); border-color: var(--navy-2); transform: translateY(-1px); }
.btn--ghost { background: transparent; color: var(--navy); border-color: var(--line-2); }
.btn--ghost:hover { background: #fff; border-color: var(--navy); color: var(--navy); }
.btn__arrow { transition: transform .25s var(--ease); }
.btn:hover .btn__arrow { transform: translateX(3px); }

.link-arrow {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 13.5px; color: var(--navy); border-bottom: 1px solid var(--line-2);
  padding-bottom: 2px; transition: border-color .2s, gap .2s;
}
.link-arrow:hover { border-color: var(--navy); gap: 11px; }

.ext::after {
  content: "↗"; font-size: .85em; margin-left: 4px; color: var(--ink-4);
  display: inline-block; transform: translateY(-1px);
}

/* ---------- 7. Hero ---------- */
.hero {
  position: relative; overflow: hidden;
  padding-block: 76px 0;
  background:
    radial-gradient(1100px 520px at 78% -10%, #eef2f6 0%, rgba(238, 242, 246, 0) 62%),
    var(--paper);
}
.hero::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image: linear-gradient(to right, rgba(23, 51, 79, .045) 1px, transparent 1px);
  background-size: 25% 100%; opacity: .8;
}
.hero__grid {
  position: relative; z-index: 1;
  display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, .88fr);
  gap: 56px; align-items: center;
  padding-bottom: 64px;
}
.hero__name {
  font-size: clamp(40px, 5.6vw, 68px); letter-spacing: -.03em; line-height: 1.04;
  margin-top: 18px;
}
.hero__name span {
  display: block; font-family: var(--serif); font-size: .38em; letter-spacing: .06em;
  font-weight: 400; color: var(--ink-3); margin-top: 12px; text-transform: none;
}
.hero__role {
  margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--line-2);
  display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: baseline;
}
.hero__role b { font-size: 15px; font-weight: 600; color: var(--navy); letter-spacing: .01em; }
.hero__role span { font-size: 13.5px; color: var(--ink-3); }
.hero__affil { margin-top: 10px; font-size: 14px; color: var(--ink-2); }
.hero__lead { margin-top: 24px; max-width: 54ch; font-size: 15.5px; line-height: 1.86; color: var(--ink-2); }
.hero__actions { margin-top: 30px; display: flex; flex-wrap: wrap; gap: 12px; }

.hero__facts { margin-top: 34px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--line); }
.hero__facts div { padding: 14px 16px 0 0; }
.hero__facts dt { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-4); }
.hero__facts dd { margin: 5px 0 0; font-size: 13px; color: var(--ink-2); }

/* cluster visual */
.cluster-box { position: relative; aspect-ratio: 1 / 1; max-width: 460px; margin-inline: auto; width: 100%; }
.cluster-box::before {
  content: ""; position: absolute; inset: 8%; border: 1px solid var(--line);
  border-radius: 50%; opacity: .7;
}
.cluster-box::after {
  content: ""; position: absolute; inset: 20%; border: 1px dashed var(--line-2);
  border-radius: 50%; opacity: .5;
}
#cluster { position: relative; z-index: 1; width: 100%; height: 100%; }
.cluster-cap {
  position: absolute; left: 0; bottom: -2px; z-index: 2;
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; color: var(--ink-3);
  background: var(--paper); padding-right: 10px;
}
.cluster-cap i { color: var(--gold); font-style: normal; }

/* statbar */
.statbar { position: relative; z-index: 1; border-top: 1px solid var(--line-2); background: rgba(255, 255, 255, .55); }
.statbar__grid { display: grid; grid-template-columns: repeat(4, 1fr); }
.stat { padding: 26px 0 24px; display: flex; align-items: baseline; gap: 10px; }
.stat + .stat { border-left: 1px solid var(--line); padding-left: 28px; }
.stat b { font-family: var(--serif); font-size: clamp(26px, 3vw, 40px); font-weight: 600; letter-spacing: -.02em; color: var(--navy); line-height: 1; }
.stat span { font-size: 11.5px; color: var(--ink-3); letter-spacing: .04em; }
.stat em { display: block; font-style: normal; font-size: 10.5px; font-family: var(--mono); color: var(--ink-4); letter-spacing: .1em; margin-top: 4px; }

/* ---------- 8. Grids & cards ---------- */
.grid { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); }
.grid--4 { grid-template-columns: repeat(4, 1fr); }
.grid--3 { grid-template-columns: repeat(3, 1fr); }
.grid--2 { grid-template-columns: repeat(2, 1fr); }

.card {
  background: var(--paper); padding: 30px 26px 28px; position: relative;
  transition: background .28s var(--ease); display: flex; flex-direction: column;
}
.card:hover { background: #fff; }
.card__no {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; color: var(--gold);
  margin-bottom: 18px; display: block;
}
.card h3 { font-size: 16.5px; margin-bottom: 12px; letter-spacing: -.005em; }
.card p { font-size: 13.5px; line-height: 1.78; color: var(--ink-2); }
.card__more { margin-top: auto; padding-top: 20px; }
.card__more a { font-size: 12.5px; color: var(--navy); display: inline-flex; gap: 6px; align-items: center; }
.card__more a:hover { text-decoration: underline; text-underline-offset: 3px; }

/* research accents */
.card--research::before {
  content: ""; position: absolute; left: 0; top: 0; height: 2px; width: 0;
  background: var(--gold-2); transition: width .45s var(--ease);
}
.card--research:hover::before { width: 100%; }

/* ---------- 9. Home: selected papers ---------- */
.mini-pubs { border-top: 1px solid var(--line); }
.mini-pub {
  display: grid; grid-template-columns: 118px minmax(0, 1fr) auto; gap: 24px;
  padding: 22px 0; border-bottom: 1px solid var(--line); align-items: start;
  transition: padding-left .25s var(--ease);
}
.mini-pub:hover { padding-left: 8px; }
.mini-pub__j {
  font-family: var(--serif); font-size: 12.5px; font-style: italic; color: var(--navy);
  line-height: 1.45;
}
.mini-pub__t { font-size: 14.5px; line-height: 1.55; color: var(--ink); max-width: 62ch; }
.mini-pub__a { margin-top: 6px; font-size: 12.5px; color: var(--ink-3); line-height: 1.6; }
.mini-pub__y { font-family: var(--mono); font-size: 12px; color: var(--ink-4); padding-top: 2px; }

/* ---------- 10. Team ---------- */
.pi-card {
  display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 40px;
  padding: 36px; background: #fff; border: 1px solid var(--line);
  margin-bottom: 56px;
}
.pi-card__side { border-right: 1px solid var(--line); padding-right: 32px; }
.pi-avatar {
  width: 100%; aspect-ratio: 1; background: var(--navy); color: #fff;
  display: grid; place-items: center; position: relative; overflow: hidden;
}
.pi-avatar b { font-family: var(--serif); font-size: 46px; letter-spacing: .02em; font-weight: 500; z-index: 1; }
.pi-avatar::after {
  content: ""; position: absolute; inset: 0;
  background: repeating-linear-gradient(45deg, rgba(255,255,255,.05) 0 1px, transparent 1px 12px);
}
.pi-card__side h3 { margin-top: 20px; font-size: 22px; }
.pi-card__side p { font-size: 12.5px; color: var(--ink-3); margin-top: 6px; }
.pi-card__side .links { margin-top: 18px; display: flex; flex-direction: column; gap: 6px; }
.pi-card__side .links a { font-size: 12px; color: var(--navy); font-family: var(--mono); }

.member-group { margin-bottom: 52px; }
.member-group__head {
  display: flex; align-items: baseline; gap: 14px; padding-bottom: 14px;
  border-bottom: 1px solid var(--line-2); margin-bottom: 1px;
}
.member-group__head h3 { font-size: 15px; letter-spacing: .04em; }
.member-group__head span { font-family: var(--mono); font-size: 10.5px; color: var(--ink-4); letter-spacing: .1em; }
.member-group__head b { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--ink-3); font-weight: 400; }

.member { display: flex; gap: 16px; padding: 22px 22px 20px; background: var(--paper); }
.member:hover { background: #fff; }
.member__av {
  width: 44px; height: 44px; flex: none; border-radius: 50%;
  background: var(--navy-soft); color: var(--navy); display: grid; place-items: center;
  font-family: var(--serif); font-size: 16px; letter-spacing: .01em;
}
.member__body h4 { font-size: 15px; font-weight: 600; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.member__body h4 em { font-style: normal; font-size: 10.5px; font-family: var(--mono); color: var(--gold); letter-spacing: .06em; }
.member__role { font-size: 11.5px; color: var(--ink-3); margin-top: 3px; letter-spacing: .02em; }
.member__to { font-size: 11.5px; color: var(--gold); margin-top: 7px; letter-spacing: .01em; }
.member--ghost { background: var(--paper); }
.member__notes { margin-top: 9px; font-size: 12px; line-height: 1.7; color: var(--ink-2); }
.member__notes li { position: relative; padding-left: 11px; }
.member__notes li::before { content: ""; position: absolute; left: 0; top: .68em; width: 3px; height: 3px; background: var(--ink-4); border-radius: 50%; }

.notice {
  display: flex; gap: 12px; padding: 14px 18px; background: var(--paper-2);
  border-left: 2px solid var(--gold-2); font-size: 12.5px; line-height: 1.75; color: var(--ink-2);
}
.notice b { color: var(--ink); font-weight: 600; }

/* ---------- 11. Research view ---------- */
.research-intro { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .8fr); gap: 64px; align-items: start; margin-bottom: 64px; }

.pipeline { border: 1px solid var(--line); background: #fff; padding: 26px; }
.pipeline__title { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; color: var(--ink-4); text-transform: uppercase; margin-bottom: 20px; }
.pipeline ol { display: flex; flex-direction: column; gap: 0; }
.pipeline li {
  display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 12px; padding: 12px 0;
  border-top: 1px solid var(--line); align-items: baseline;
}
.pipeline li:first-child { border-top: 0; padding-top: 0; }
.pipeline li i { font-family: var(--mono); font-size: 10px; color: var(--gold); font-style: normal; }
.pipeline li b { font-size: 13.5px; font-weight: 600; display: block; }
.pipeline li span { font-size: 11.5px; color: var(--ink-3); display: block; margin-top: 2px; line-height: 1.6; }

.dir { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 48px; padding-block: 48px; border-top: 1px solid var(--line); }
.dir:last-child { border-bottom: 1px solid var(--line); }
.dir__aside h3 { font-size: 17.5px; line-height: 1.4; }
.dir__aside .idx {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; color: var(--gold);
  display: block; margin-bottom: 12px;
}
.dir__aside p { font-size: 12px; color: var(--ink-3); margin-top: 12px; line-height: 1.7; font-family: var(--serif); font-style: italic; }
.dir__body > p { font-size: 14.5px; line-height: 1.85; color: var(--ink-2); max-width: 68ch; }
.dir__points { margin-top: 22px; display: grid; gap: 10px; }
.dir__points li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; font-size: 13.5px; line-height: 1.75; color: var(--ink-2); }
.dir__points li::before { content: "—"; color: var(--gold-2); font-size: 12px; }
.tags { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 7px; }
.tag {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; color: var(--ink-2);
  border: 1px solid var(--line-2); padding: 3px 9px; border-radius: 2px; background: #fff;
}

/* ---------- 12. Publications ---------- */
.pub-toolbar {
  display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
  padding-bottom: 20px; border-bottom: 1px solid var(--line-2); margin-bottom: 8px;
}
.tabs { display: flex; gap: 2px; flex-wrap: wrap; }
.tabs button {
  padding: 7px 15px; font-size: 13px; color: var(--ink-2); border: 1px solid transparent;
  border-radius: 2px; transition: background .2s, color .2s, border-color .2s;
}
.tabs button:hover { background: var(--paper-2); }
.tabs button.is-on { background: var(--navy); color: #fff; border-color: var(--navy); }

.search { position: relative; margin-left: auto; min-width: 210px; }
.search input {
  width: 100%; padding: 8px 12px 8px 32px; font-size: 13px; font-family: var(--sans);
  border: 1px solid var(--line-2); background: #fff; color: var(--ink); border-radius: 2px;
}
.search input::placeholder { color: var(--ink-4); }
.search input:focus { outline: none; border-color: var(--navy); }
.search::before {
  content: ""; position: absolute; left: 11px; top: 50%; width: 11px; height: 11px;
  margin-top: -6px; border: 1.5px solid var(--ink-4); border-radius: 50%;
}
.search::after {
  content: ""; position: absolute; left: 20px; top: 50%; width: 5px; height: 1.5px;
  background: var(--ink-4); transform: rotate(45deg); margin-top: 4px;
}

.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 16px 0 4px; }
.chip {
  padding: 4px 11px; font-size: 11.5px; font-family: var(--mono); letter-spacing: .04em;
  color: var(--ink-3); border: 1px solid var(--line); border-radius: 2px; background: transparent;
  transition: all .18s;
}
.chip:hover { border-color: var(--line-2); color: var(--ink); }
.chip.is-on { background: var(--ink); color: #fff; border-color: var(--ink); }
.chip-label {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; color: var(--ink-4);
  padding: 4px 8px 4px 0; align-self: center; text-transform: uppercase;
}

.pub-count { font-family: var(--mono); font-size: 11px; color: var(--ink-4); letter-spacing: .08em; padding: 14px 0 4px; }

.yearblock { padding-top: 26px; }
.yearblock__h {
  display: flex; align-items: center; gap: 16px; padding-bottom: 12px;
}
.yearblock__h b { font-family: var(--serif); font-size: 21px; font-weight: 600; color: var(--navy); letter-spacing: .01em; }
.yearblock__h i { flex: 1; height: 1px; background: var(--line); }
.yearblock__h em { font-family: var(--mono); font-size: 10.5px; color: var(--ink-4); font-style: normal; }

.pub { padding: 15px 0 15px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: minmax(0,1fr) 96px; gap: 20px; }
.pub:hover { background: rgba(255,255,255,.7); }
.pub__a { font-size: 13px; line-height: 1.66; color: var(--ink-2); }
.pub__a b { color: var(--navy); font-weight: 600; }
.pub__r { margin-top: 5px; font-size: 13px; color: var(--ink-2); line-height: 1.6; }
.pub__r em { font-family: var(--serif); font-style: italic; color: var(--ink); }
.pub__r a { color: var(--navy); border-bottom: 1px solid var(--line-2); word-break: break-all; }
.pub__r a:hover { border-color: var(--navy); }
.pub__badges { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; align-content: flex-start; }
.badge {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em; padding: 2px 6px;
  border: 1px solid var(--line-2); color: var(--ink-3); border-radius: 2px; white-space: nowrap;
}
.badge--corr { background: var(--navy-soft); border-color: #c9d5e1; color: var(--navy); }
.badge--first { background: var(--gold-soft); border-color: #e2cba4; color: var(--gold); }
.badge--ug { background: #eef4ee; border-color: #cadcc9; color: #47734a; }

/* projects */
.proj { padding: 26px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 120px minmax(0,1fr) 150px; gap: 32px; }
.proj:first-child { border-top: 1px solid var(--line); }
.proj__k { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; color: var(--gold); }
.proj__k span { display: block; font-family: var(--sans); font-size: 10.5px; color: var(--ink-4); letter-spacing: .02em; margin-top: 5px; }
.proj h3 { font-size: 15px; line-height: 1.55; font-weight: 600; }
.proj__meta { margin-top: 9px; font-size: 12.5px; color: var(--ink-3); line-height: 1.7; }
.proj__side { text-align: right; font-size: 12px; color: var(--ink-3); font-family: var(--mono); line-height: 1.9; }
.proj__side b { display: block; font-family: var(--serif); font-size: 17px; color: var(--navy); font-weight: 600; }

/* honors table */
.honor-list { border-top: 1px solid var(--line); }
.honor-list li { display: grid; grid-template-columns: 96px minmax(0,1fr); gap: 24px; padding: 15px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.honor-list li span { font-family: var(--mono); font-size: 11.5px; color: var(--gold); }

/* ---------- 13. News ---------- */
.news-toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-bottom: 18px; border-bottom: 1px solid var(--line-2); }
.news-updated { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--ink-4); letter-spacing: .04em; display: flex; align-items: center; gap: 6px; }
.dot-live { width: 5px; height: 5px; border-radius: 50%; background: #4f8a5b; box-shadow: 0 0 0 3px rgba(79,138,91,.15); }

.news-list { margin-top: 8px; }
.news-item {
  display: grid; grid-template-columns: 96px minmax(0,1fr) 132px; gap: 28px;
  padding: 24px 0; border-bottom: 1px solid var(--line); align-items: start;
  transition: padding-left .25s var(--ease);
}
.news-item:hover { padding-left: 8px; }
.news-item__date { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); letter-spacing: .02em; padding-top: 3px; }
.news-item__date b { display: block; font-family: var(--mono); font-size: 13.5px; color: var(--navy); font-weight: 600; letter-spacing: .02em; }
.news-item__t { font-size: 15.5px; line-height: 1.55; font-weight: 600; color: var(--ink); }
a.news-item__t:hover { color: var(--navy); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.news-item__d { margin-top: 7px; font-size: 12.5px; line-height: 1.75; color: var(--ink-3); max-width: 70ch; }
.news-item__src { margin-top: 11px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.src {
  display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--ink-2);
  background: var(--paper-2); border: 1px solid var(--line); padding: 2px 8px; border-radius: 2px;
}
.src svg { width: 11px; height: 11px; flex: none; }
.news-item__kind { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 7px; }
.kind {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; padding: 3px 7px;
  border-radius: 2px; border: 1px solid var(--line-2); color: var(--ink-3); white-space: nowrap;
}
.kind--media { border-color: #d9c3a0; color: var(--gold); background: var(--gold-soft); }
.kind--group { border-color: #c6d2dd; color: var(--navy); background: var(--navy-soft); }
.kind--talk { border-color: #cdd8cd; color: #4a6b4d; background: #eef3ee; }
.kind--award { border-color: #e0d0c4; color: #8a5a3b; background: #f7efe9; }
.kind--pin { border-color: #c9b089; color: #7a5a2e; background: var(--gold-soft); font-weight: 600; }
.news-item.is-pinned { background: linear-gradient(90deg, var(--gold-soft), transparent 46%); }

.aggregator-note {
  margin-top: 44px; padding: 22px 24px; border: 1px solid var(--line); background: #fff;
  display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 28px; align-items: center;
}
.aggregator-note h4 { font-size: 13.5px; margin-bottom: 7px; }
.aggregator-note p { font-size: 12.5px; line-height: 1.75; color: var(--ink-3); max-width: 74ch; }
.aggregator-note code { font-family: var(--mono); font-size: 11.5px; background: var(--paper-2); padding: 1px 5px; }

/* ---------- 14. Join ---------- */
.join-grid { display: grid; grid-template-columns: minmax(0,1.15fr) minmax(0,.85fr); gap: 56px; align-items: start; }
.join-block + .join-block { margin-top: 44px; padding-top: 36px; border-top: 1px solid var(--line); }
.join-grid .lead-lg + .join-block { margin-top: 34px; }
.join-block h3 { font-size: 17px; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
.join-block h3 span { font-family: var(--mono); font-size: 10px; color: var(--gold); letter-spacing: .1em; }
.join-block p { font-size: 14px; line-height: 1.85; color: var(--ink-2); }
.check { margin-top: 16px; display: grid; gap: 9px; }
.check li { display: grid; grid-template-columns: 20px minmax(0,1fr); gap: 10px; font-size: 13.5px; line-height: 1.7; color: var(--ink-2); }
.check li::before { content: "✓"; color: var(--gold); font-size: 12px; line-height: 1.9; }

.join-aside { background: #fff; border: 1px solid var(--line); padding: 32px 30px; position: sticky; top: 92px; }
.join-aside h3 { font-size: 15px; margin-bottom: 18px; }
.join-aside dl { display: grid; gap: 14px; }
.join-aside dt { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-4); }
.join-aside dd { margin: 3px 0 0; font-size: 13.5px; color: var(--ink-2); line-height: 1.65; }
.join-aside .btn { margin-top: 24px; width: 100%; justify-content: center; }

/* ---------- 15. Contact ---------- */
.contact-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); }
.contact-cell { background: var(--paper); padding: 30px 26px; }
.contact-cell:hover { background: #fff; }
.contact-cell dt { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-4); }
.contact-cell dd { margin: 12px 0 0; font-size: 14.5px; line-height: 1.7; color: var(--ink); }
.contact-cell dd a { border-bottom: 1px solid var(--line-2); }
.contact-cell dd a:hover { border-color: var(--navy); color: var(--navy); }
.contact-cell p { margin-top: 10px; font-size: 12px; color: var(--ink-3); }

.map-card { margin-top: 40px; border: 1px solid var(--line); background: #fff; display: grid; grid-template-columns: minmax(0,1fr) 380px; }
.map-canvas { position: relative; min-height: 260px; background: var(--paper-2); overflow: hidden; }
.map-canvas svg { width: 100%; height: 100%; position: absolute; inset: 0; }
.map-info { padding: 30px; border-left: 1px solid var(--line); }
.map-info h3 { font-size: 15px; margin-bottom: 12px; }
.map-info p { font-size: 13px; line-height: 1.8; color: var(--ink-2); }
.map-info .kv { margin-top: 18px; display: grid; gap: 10px; }
.map-info .kv div { display: grid; grid-template-columns: 68px minmax(0,1fr); gap: 10px; font-size: 12.5px; }
.map-info .kv dt { font-family: var(--mono); font-size: 10.5px; color: var(--ink-4); letter-spacing: .06em; padding-top: 2px; }
.map-info .kv dd { margin: 0; color: var(--ink-2); }

/* ---------- 16. Footer ---------- */
.footer { margin-top: 0; border-top: 1px solid var(--line-2); background: var(--paper-2); }
.footer__grid { display: grid; grid-template-columns: minmax(0,1.4fr) minmax(0,.8fr) minmax(0,.8fr); gap: 56px; padding-block: 52px 40px; }
.footer h4 { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-4); margin-bottom: 16px; font-weight: 500; }
.footer p { font-size: 12.5px; line-height: 1.85; color: var(--ink-3); max-width: 40ch; }
.footer ul { display: grid; gap: 8px; }
.footer li a, .footer li { font-size: 12.5px; color: var(--ink-2); }
.footer li a:hover { color: var(--navy); text-decoration: underline; text-underline-offset: 3px; }
.footer__brand { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.footer__brand .brand__mark { width: 28px; height: 28px; }
.footer__brand strong { font-size: 14px; letter-spacing: .02em; }
.footer__bottom {
  border-top: 1px solid var(--line); padding-block: 18px 22px;
  display: flex; flex-wrap: wrap; gap: 12px 28px; justify-content: space-between;
  font-family: var(--mono); font-size: 10.5px; color: var(--ink-4); letter-spacing: .03em;
}

/* ---------- 16b. 组件补充 ---------- */
.stat b i {
  font-style: normal; font-size: .5em; color: var(--gold); font-family: var(--mono);
  letter-spacing: 0; vertical-align: super; margin-left: 1px;
}
.stat em { order: 2; }
.mini-pub__t { display: block; }
.mini-pub__a { display: block; }
.member-group .grid { border-top: 0; }
.pi-card__body > p { font-size: 14.5px; line-height: 1.88; color: var(--ink-2); }
.pi-card__body > p + p { margin-top: 15px; }
.pi-card__body .lead-lg { font-size: 15px; color: var(--ink-2); }
.honor-list--time li { grid-template-columns: 132px minmax(0, 1fr); align-items: baseline; }
.honor-list--time li b { font-size: 14px; font-weight: 600; }

.cta-band {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 40px; align-items: center;
  padding: 44px 46px; background: var(--navy); color: #fff;
}
.cta-band h3 { font-size: 23px; margin-top: 12px; color: #fff; }
.cta-band p { color: rgba(255, 255, 255, .68); font-size: 13.5px; margin-top: 10px; max-width: 62ch; line-height: 1.8; }
.cta-band .kicker { color: var(--gold-2); }
.cta-band .kicker::after { background: rgba(255, 255, 255, .28); }
.cta-band .btn { background: #fff; color: var(--navy); border-color: #fff; flex: none; }
.cta-band .btn:hover { background: var(--gold-2); border-color: var(--gold-2); color: var(--navy-2); }

.pipeline li div { min-width: 0; }

/* ---------- 17. Responsive ---------- */
@media (max-width: 1080px) {
  :root { --gutter: 36px; }
  .nav a { padding: 8px 9px; font-size: 13px; }
  .hero__grid { gap: 40px; }
  .grid--4 { grid-template-columns: repeat(2, 1fr); }
  .contact-grid { grid-template-columns: repeat(2, 1fr); }
  .map-card { grid-template-columns: 1fr; }
  .map-info { border-left: 0; border-top: 1px solid var(--line); }
}

@media (max-width: 900px) {
  .nav {
    position: fixed; inset: 68px 0 auto 0; z-index: 55;
    flex-direction: column; align-items: stretch; gap: 0;
    background: var(--paper); border-bottom: 1px solid var(--line);
    padding: 8px var(--gutter) 24px;
    transform: translateY(-108%); transition: transform .4s var(--ease), visibility .4s;
    visibility: hidden; pointer-events: none;
    box-shadow: 0 24px 40px -30px rgba(20,24,29,.4);
    max-height: calc(100vh - 68px); overflow-y: auto;
  }
  .nav.is-open { transform: none; visibility: visible; pointer-events: auto; }
  .nav a { padding: 15px 0; font-size: 15px; border-bottom: 1px solid var(--line); }
  .nav a::after { display: none; }
  .nav a.is-on { color: var(--navy); }
  .burger { display: flex; }
  .topbar__inner { justify-content: space-between; gap: 16px; }

  .hero { padding-top: 48px; }
  .hero__grid { grid-template-columns: 1fr; gap: 36px; padding-bottom: 48px; }
  .hero__visual { order: -1; }
  .cluster-box { max-width: 320px; margin-inline: 0; }
  .hero__facts div { padding: 10px 0; }
  .hero__name { font-size: clamp(36px, 9vw, 52px); }
  .statbar__grid { grid-template-columns: repeat(2, 1fr); }
  .stat { padding: 20px 0; }
  .stat + .stat { border-left: 0; padding-left: 0; }
  .stat:nth-child(even) { border-left: 1px solid var(--line); padding-left: 24px; }
  .stat:nth-child(n+3) { border-top: 1px solid var(--line); }

  .sec { padding-block: 60px; }
  .sec-head { flex-direction: column; align-items: flex-start; gap: 18px; margin-bottom: 32px; }
  .sec-num { order: -1; }

  .pi-card { grid-template-columns: 1fr; gap: 28px; padding: 26px; }
  .pi-card__side { border-right: 0; border-bottom: 1px solid var(--line); padding: 0 0 24px; display: flex; gap: 20px; align-items: center; }
  .pi-avatar { width: 96px; flex: none; }
  .pi-card__side h3 { margin-top: 0; }

  .research-intro { grid-template-columns: 1fr; gap: 32px; }
  .dir { grid-template-columns: 1fr; gap: 20px; padding-block: 36px; }
  .join-grid { grid-template-columns: 1fr; gap: 36px; }
  .join-aside { position: static; }

  .proj { grid-template-columns: 1fr; gap: 12px; }
  .proj__side { text-align: left; display: flex; gap: 20px; align-items: baseline; }
  .proj__side b { font-size: 15px; }

  .mini-pub { grid-template-columns: 1fr; gap: 8px; }
  .mini-pub__y { order: -1; }
  .mini-pub__j { font-size: 12.5px; }

  .news-item { grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; padding: 20px 0; }
  .news-item__date { display: flex; align-items: baseline; gap: 8px; padding-top: 0; grid-column: 1; grid-row: 1; }
  .news-item__date b { font-size: 13.5px; }
  .news-item__kind { flex-direction: row; align-items: center; grid-column: 2; grid-row: 1; justify-self: end; }
  .news-item > div:nth-child(2) { grid-column: 1 / -1; grid-row: 2; }
  .news-updated { margin-left: 0; width: 100%; padding-top: 6px; }

  .pub { grid-template-columns: 1fr; gap: 8px; }
  .pub__badges { justify-content: flex-start; }
  .aggregator-note { grid-template-columns: 1fr; gap: 16px; }
  .footer__grid { grid-template-columns: 1fr; gap: 32px; padding-block: 40px 28px; }
}

@media (max-width: 640px) {
  :root { --gutter: 20px; }
  body { font-size: 15px; }
  .brand__text small { display: none; }
  .cluster-box { max-width: 240px; }
  .grid--2, .grid--3, .grid--4 { grid-template-columns: 1fr; }
  .member--ghost { display: none; }
  .contact-grid { grid-template-columns: 1fr; }
  .hero__facts { grid-template-columns: 1fr; }
  .hero__facts div { padding: 10px 0; border-top: 1px solid var(--line); }
  .hero__facts div:first-child { border-top: 0; }
  .hero__facts div { display: flex; justify-content: space-between; align-items: baseline; }
  .hero__facts dt { margin: 0; }
  .hero__facts dd { margin: 0; }
  .sec-head h2 { font-size: 24px; }
  .search { margin-left: 0; width: 100%; }
  .pub-toolbar { gap: 10px; }
  .tabs { width: 100%; overflow-x: auto; padding-bottom: 2px; }
  .dir__points li { grid-template-columns: 14px minmax(0,1fr); }
  .honor-list li { grid-template-columns: 1fr; gap: 4px; }
  .map-card { grid-template-columns: 1fr; }
  .footer__bottom { flex-direction: column; gap: 8px; }
  .stat b { font-size: 26px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  html { scroll-behavior: auto; }
}

@media print {
  .topbar, .footer, .burger, .lang, .news-toolbar, .pub-toolbar { display: none !important; }
  .view { display: block !important; }
  body { background: #fff; }
}

  /* ---------------- 论文 ---------------- */
  function peiRole(a) {
    return {
      corr: /W\. Pei\*/.test(a),
      cofirst: /W\. Pei\s*#/.test(a),
      first: /^W\. Pei[#*]?,/.test(a) || /^W\. Pei[#*]?$/.test(a)
    };
  }

  function filteredPapers() {
    var q = state.pubQuery.trim().toLowerCase();
    return D.papers.filter(function (x) {
      var r = peiRole(x.a);
      if (state.pubFilter === 'first' && !r.first) return false;
      if (state.pubFilter === 'corr' && !r.corr) return false;
      if (state.pubFilter === 'coop' && (r.first || r.corr || r.cofirst)) return false;
      if (state.pubYear !== 'all' && String(x.y) !== state.pubYear) return false;
      if (q) {
        var hay = (x.a + ' ' + x.j + ' ' + x.y + ' ' + (x.d || '')).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function pubListHTML() {
    var list = filteredPapers();
    if (!list.length) return '<p class="small muted" style="padding:36px 0">' + t('pubs.empty') + '</p>';

    var years = [];
    list.forEach(function (x) { if (years.indexOf(x.y) === -1) years.push(x.y); });
    years.sort(function (a, b) { return b - a; });

    return years.map(function (y) {

  /* ---------------- 集群可视化 ---------------- */
  function initCluster() {
    var svg = document.getElementById('cluster');
    if (!svg || state.clusterReady) return;
    state.clusterReady = true;

    var NS = 'http://www.w3.org/2000/svg';
    var phi = (1 + Math.sqrt(5)) / 2;
    var raw = [[0, 1, phi], [0, 1, -phi], [0, -1, phi], [0, -1, -phi], [1, phi, 0], [1, -phi, 0],
      [-1, phi, 0], [-1, -phi, 0], [phi, 0, 1], [-phi, 0, 1], [phi, 0, -1], [-phi, 0, -1]];
    var V = raw.map(function (v) {
      var n = Math.sqrt(v[0] * v[0] + v[1] * v[1] + v[2] * v[2]);
      return [v[0] / n, v[1] / n, v[2] / n];
    });
    var E = [];
    for (var i = 0; i < 12; i++) {
      for (var j = i + 1; j < 12; j++) {
        var dx = V[i][0] - V[j][0], dy = V[i][1] - V[j][1], dz = V[i][2] - V[j][2];
        if (Math.sqrt(dx * dx + dy * dy + dz * dz) < 1.3) E.push([i, j]);
      }
    }

    var gEdge = document.createElementNS(NS, 'g');
    var gLig = document.createElementNS(NS, 'g');
    var gAtom = document.createElementNS(NS, 'g');
    var gCore = document.createElementNS(NS, 'g');
    svg.appendChild(gEdge); svg.appendChild(gLig); svg.appendChild(gAtom); svg.appendChild(gCore);

    var lines = E.map(function () {
      var l = document.createElementNS(NS, 'line');
      l.setAttribute('stroke', '#cbc2ae');
      l.setAttribute('stroke-width', '1');
      l.setAttribute('x1', 210); l.setAttribute('y1', 208);
      l.setAttribute('x2', 210); l.setAttribute('y2', 208);
      gEdge.appendChild(l); return l;
    });
    var stubs = V.map(function () {
      var l = document.createElementNS(NS, 'line');
      l.setAttribute('stroke', '#ddd5c5');
      l.setAttribute('stroke-width', '0.8');
      l.setAttribute('x1', 210); l.setAttribute('y1', 208);
      l.setAttribute('x2', 210); l.setAttribute('y2', 208);
      gLig.appendChild(l);
      var c = document.createElementNS(NS, 'circle');
      c.setAttribute('r', '2.4');
      c.setAttribute('cx', 210); c.setAttribute('cy', 208);
      c.setAttribute('fill', '#dccfb7');
      gLig.appendChild(c);
      return { l: l, c: c };
    });
    var dots = V.map(function (_, k) {
      var c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', 210); c.setAttribute('cy', 208); c.setAttribute('r', '5');
      c.setAttribute('fill', k % 3 === 0 ? '#b07c33' : (k % 3 === 1 ? '#c9a068' : '#a06f2e'));
      gAtom.appendChild(c); return c;
    });
    var halo = document.createElementNS(NS, 'circle');
    halo.setAttribute('cx', 210); halo.setAttribute('cy', 208);
    halo.setAttribute('r', '26'); halo.setAttribute('fill', 'rgba(122,79,34,.12)');
    var core = document.createElementNS(NS, 'circle');
    core.setAttribute('cx', 210); core.setAttribute('cy', 208);
    core.setAttribute('r', '14'); core.setAttribute('fill', '#6d4420');
    var coreLabel = document.createElementNS(NS, 'text');
    coreLabel.setAttribute('x', 210); coreLabel.setAttribute('y', 208);
    coreLabel.setAttribute('text-anchor', 'middle');
    coreLabel.setAttribute('dominant-baseline', 'central');
    coreLabel.setAttribute('font-family', 'Georgia, serif');
    coreLabel.setAttribute('font-size', '12');
    coreLabel.setAttribute('fill', '#fdf8ef');
    coreLabel.textContent = 'M';
    gCore.appendChild(halo); gCore.appendChild(core); gCore.appendChild(coreLabel);

    var cx = 210, cy = 208, R = 108, ax = -0.42, ay = 0.35;
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function frame() {
      if (state.view !== 'home') { state.clusterRaf = null; return; }
      ay += reduce ? 0 : 0.0032;
      ax = -0.42 + Math.sin(ay * 0.6) * 0.06;

      var ca = Math.cos(ay), sa = Math.sin(ay), cb = Math.cos(ax), sb = Math.sin(ax);
      var proj = V.map(function (v) {
        var x1 = v[0] * ca + v[2] * sa;
        var z1 = -v[0] * sa + v[2] * ca;
        var y1 = v[1] * cb - z1 * sb;
        var z2 = v[1] * sb + z1 * cb;
        var s = 1 / (1 - z2 * 0.16);
        return { x: cx + x1 * R * s, y: cy + y1 * R * s, z: z2, s: s };
      });

      E.forEach(function (e, k) {
        var a = proj[e[0]], b = proj[e[1]];
        lines[k].setAttribute('x1', a.x.toFixed(1)); lines[k].setAttribute('y1', a.y.toFixed(1));
        lines[k].setAttribute('x2', b.x.toFixed(1)); lines[k].setAttribute('y2', b.y.toFixed(1));
        lines[k].setAttribute('opacity', (0.34 + (a.z + b.z + 2) / 4 * 0.52).toFixed(2));
      });
      proj.forEach(function (p, k) {
        var v = V[k];
        var ox = cx + (p.x - cx) * 1.34, oy = cy + (p.y - cy) * 1.34;
        stubs[k].l.setAttribute('x1', p.x.toFixed(1)); stubs[k].l.setAttribute('y1', p.y.toFixed(1));
        stubs[k].l.setAttribute('x2', ox.toFixed(1)); stubs[k].l.setAttribute('y2', oy.toFixed(1));
        stubs[k].l.setAttribute('opacity', (0.25 + (p.z + 1) / 2 * 0.5).toFixed(2));
        stubs[k].c.setAttribute('cx', ox.toFixed(1)); stubs[k].c.setAttribute('cy', oy.toFixed(1));
        stubs[k].c.setAttribute('opacity', (0.3 + (p.z + 1) / 2 * 0.55).toFixed(2));
        dots[k].setAttribute('cx', p.x.toFixed(1));
        dots[k].setAttribute('cy', p.y.toFixed(1));
        dots[k].setAttribute('r', (4.4 + (p.z + 1) * 1.8).toFixed(2));
        dots[k].setAttribute('opacity', (0.55 + (p.z + 1) / 2 * 0.45).toFixed(2));
      });

      state.clusterRaf = requestAnimationFrame(frame);
    }
    if (state.clusterRaf) cancelAnimationFrame(state.clusterRaf);
    state.clusterRaf = requestAnimationFrame(frame);
  }

    team: { zh: '成员介绍 · 裴玮课题组', en: 'People · Pei Lab' },
    research: { zh: '研究方向 · 裴玮课题组', en: 'Research · Pei Lab' },
    publications: { zh: '科研成果 · 裴玮课题组', en: 'Publications · Pei Lab' },
    news: { zh: '新闻动态 · 裴玮课题组', en: 'News · Pei Lab' },
    join: { zh: '招生招聘 · 裴玮课题组', en: 'Join us · Pei Lab' },
    contact: { zh: '联系方式 · 裴玮课题组', en: 'Contact · Pei Lab' }
  };

  function parseHash() {
    var h = (location.hash || '').replace(/^#\/?/, '').replace(/\/$/, '');
    return VIEWS.indexOf(h) > -1 ? h : 'home';
  }

  function renderView(view, animate) {
    VIEWS.forEach(function (v) {
      var el = document.getElementById('view-' + v);
      if (!el) return;
      if (v === view) {
        el.innerHTML = RENDER[v]();
        el.classList.add('is-active');
      } else {
        el.classList.remove('is-active');
        el.innerHTML = '';
      }
    });
    $$('.nav a').forEach(function (a) {
      a.classList.toggle('is-on', a.getAttribute('data-nav') === (view === 'publications' ? 'pubs' : view));
    });
    document.title = pick(TITLES[view]);
    document.documentElement.lang = state.lang === 'zh' ? 'zh-CN' : 'en';
    if (view === 'home') initCluster();
    if (view === 'publications') bindPubSearch();
  }

  function bindPubSearch() {
    var input = document.getElementById('pubSearch');
    if (!input) return;
    input.addEventListener('input', function () {
      state.pubQuery = input.value;
      var list = document.getElementById('pubList');
      var count = document.getElementById('pubCount');
      if (list) list.innerHTML = pubListHTML();
      if (count) count.textContent = filteredPapers().length + ' ' + t('pubs.count');
    });
  }

  function go(view, push) {
    if (VIEWS.indexOf(view) === -1) view = 'home';
    state.view = view;
    if (push !== false && location.hash !== '#/' + view) {
      history.pushState(null, '', '#/' + view);
    }
    renderView(view, true);
    closeNav();
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  /* ---------------- 导航 & 语言 ---------------- */
  function closeNav() {
    var nav = $('#nav'), burger = $('#burger');
    if (nav) nav.classList.remove('is-open');
    if (burger) burger.setAttribute('aria-expanded', 'false');
  }

  function bindNav() {
    document.addEventListener('click', function (e) {
      var a = e.target.closest ? e.target.closest('a[href^="#/"]') : null;
      if (a) {
        e.preventDefault();
        go(a.getAttribute('href').replace(/^#\//, ''));
        return;
      }
      var tab = e.target.closest ? e.target.closest('[data-pubtab]') : null;
      if (tab) { state.pubTab = tab.getAttribute('data-pubtab'); renderView('publications'); return; }
      var pf = e.target.closest ? e.target.closest('[data-pubfilter]') : null;
      if (pf) { state.pubFilter = pf.getAttribute('data-pubfilter'); renderView('publications'); return; }
      var py = e.target.closest ? e.target.closest('[data-pubyear]') : null;
      if (py) {
        var yv = py.getAttribute('data-pubyear');
        state.pubYear = (state.pubYear === yv) ? 'all' : yv;
        renderView('publications'); return;
      }
      var nf = e.target.closest ? e.target.closest('[data-newsfilter]') : null;
      if (nf) { state.newsFilter = nf.getAttribute('data-newsfilter'); renderView('news'); return; }
      var lb = e.target.closest ? e.target.closest('[data-lang]') : null;
      if (lb) { setLang(lb.getAttribute('data-lang')); return; }
    });

    var burger = $('#burger');
    if (burger) {
      burger.addEventListener('click', function () {
        var nav = $('#nav');
        var open = nav.classList.toggle('is-open');
        burger.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
    }
    window.addEventListener('popstate', function () { go(parseHash(), false); });
    window.addEventListener('hashchange', function () {
      var v = parseHash();
      if (v !== state.view) go(v, false);
    });
  }

  function applyChrome() {
    document.documentElement.lang = state.lang === 'zh' ? 'zh-CN' : 'en';
    $$('[data-i18n]').forEach(function (el) {
      el.textContent = t(el.getAttribute('data-i18n'));
    });
    $$('[data-lang]').forEach(function (b) {
      b.classList.toggle('is-on', b.getAttribute('data-lang') === state.lang);
    });
  }

  function setLang(lang) {
    if (lang !== 'zh' && lang !== 'en') return;
    if (state.lang === lang) return;
    state.lang = lang;
    localStorage.setItem('lab-lang', lang);
    applyChrome();
    renderFooter();
    renderView(state.view);
  }

  /* ---------------- 新闻聚合数据 ---------------- */
  function mergeLive(items) {
    var seen = {};
    var all = [];
    items.concat(state.news).forEach(function (n) {
      if (!n || !n.date) return;
      var k = pick(n.t).replace(/\s+/g, '').slice(0, 26);
      if (seen[k]) return;
      seen[k] = 1;
      all.push(n);
    });
    all.sort(newsSort);
    return all;
  }

  function loadNews() {
    // 单文件版（dist/）会把 news.json 直接内联，省掉一次请求，也不受 file:// 限制
    var inline = window.__NEWS_DATA__;
    if (inline && Array.isArray(inline.items) && inline.items.length) {
      state.news = mergeLive(inline.items);
      state.newsUpdated = inline.updated || D.meta.updated;
      state.newsSource = 'live';
      // boot 时本函数在首屏渲染之后才执行，需按当前栏目重绘一次
      if (state.view === 'home' || state.view === 'news') renderView(state.view);
      return;
    }
    if (!window.fetch || location.protocol === 'file:') return;
    fetch('data/news.json', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (!j || !Array.isArray(j.items) || !j.items.length) return;
        state.news = mergeLive(j.items);
        state.newsUpdated = j.updated || D.meta.updated;
        state.newsSource = 'live';
        if (state.view === 'home' || state.view === 'news') renderView(state.view);
      })
      .catch(function () { /* 保留内置数据 */ });
  }

  /* ---------------- 嵌入模式 ---------------- */
  // 被 iframe 内嵌时（?embed=1）：去掉品牌署名与页脚，只留栏目导航，
  // 并把文档高度通过 postMessage 告诉宿主页面，以便自动撑开 iframe。
  function setupEmbed() {
    document.documentElement.classList.add('is-embed');
    var last = -1;
    function send() {
      var h = Math.ceil(Math.max(
        document.documentElement.scrollHeight,
        document.body.getBoundingClientRect().height));
      if (Math.abs(h - last) < 2) return;
      last = h;
      try { parent.postMessage({ type: 'pei-lab:height', height: h }, '*'); } catch (e) { /* 非嵌入环境 */ }
    }
    if (window.ResizeObserver) {
      new ResizeObserver(send).observe(document.body);
    }
    window.addEventListener('load', send);
    window.addEventListener('resize', send);
    window.addEventListener('hashchange', function () { setTimeout(send, 60); });
    [200, 700, 1500, 2600].forEach(function (t) { setTimeout(send, t); });
  }

  /* ---------------- 启动 ---------------- */
  function boot() {
    var q = (location.search.match(/[?&]lang=(zh|en)/) || [])[1];
    if (q) state.lang = q;
    applyChrome();
    renderFooter();
    state.view = parseHash();
    renderView(state.view);
    bindNav();
    loadNews();
    if (/[?&]embed=1/.test(location.search)) setupEmbed();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();

</script>
</body>
</html>
